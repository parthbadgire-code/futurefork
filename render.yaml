services:
  - type: web
    name: futurefork-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      # Set to your deployed frontend origin(s), comma-separated
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NUM_SIMULATION_RUNS
        value: 300
      - key: RANDOM_SEED
        value: 42
