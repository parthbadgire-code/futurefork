name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff
      - name: Run Ruff Lint
        run: |
          ruff check backend/ contracts/ data/ scripts/ engine/ ai/
      - name: Run Backend & Engine Tests
        run: |
          python -m pytest backend/tests/ engine/tests/ -v
      - name: Run E2E Pipeline
        env:
          FUTUREFORK_OFFLINE: "1"
        run: |
          python scripts/e2e.py
      - name: Run AI Evaluation Suite
        env:
          FUTUREFORK_OFFLINE: "1"
        run: |
          python ai/evals/test_prompts.py

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build Frontend
        working-directory: frontend
        run: pnpm run build
