services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:////app/db/futurefork.db
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      # Optional: pass an LLM key through from your shell
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - futurefork-db:/app/db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # The browser calls the API directly, so this is the host-visible URL
      - VITE_API_URL=http://localhost:8000
      - VITE_USE_MOCKS=false
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  futurefork-db:
